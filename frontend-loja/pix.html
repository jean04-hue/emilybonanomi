<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento PIX – Emily Bonanomi</title>
<meta name="description" content="Finalize seu pagamento via PIX de forma rápida e segura.">
<link rel="canonical" href="/pix.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👗%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
.pix-wrap{max-width:640px;margin:40px auto;padding:32px;background:#fff;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.08);text-align:center;font-family:'Poppins',sans-serif}
.pix-wrap h1{font-family:'Playfair Display',serif;margin:0 0 8px;color:#1a1a1a}
.pix-info{color:#666;margin:4px 0}
.pix-info strong{color:#1a1a1a}
.pix-qrcode{width:260px;height:260px;margin:22px auto;border:1px solid #eee;border-radius:8px;padding:8px;background:#fff}
.pix-code{width:100%;min-height:80px;padding:12px;border:1px dashed #ccc;border-radius:8px;font-family:monospace;font-size:12px;resize:none;margin-bottom:12px;background:#fafafa}
.pix-btn{background:#1a1a1a;color:#fff;border:0;padding:12px 26px;border-radius:8px;cursor:pointer;font-weight:600;letter-spacing:.5px;margin:4px}
.pix-btn.sec{background:#efe3d4;color:#1a1a1a}
.pix-status{margin-top:18px;padding:12px 16px;border-radius:8px;font-weight:600}
.pix-status.pending{background:#fff5d6;color:#8a6d00}
.pix-status.approved{background:#dff6df;color:#1e6b1e}
.pix-status.rejected{background:#fddede;color:#8a1e1e}
.pix-timer{font-size:28px;font-weight:700;color:#1a1a1a;margin:8px 0 4px}
.pix-timer.warn{color:#c0392b}

/* ===== Loading PIX ===== */

.pix-loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.spinner{
    width:52px;
    height:52px;

    border:5px solid #ececec;
    border-top:5px solid #1a1a1a;

    border-radius:50%;

    animation:spin .9s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    font-weight:600;
    color:#444;
}

.loading-subtitle{
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>
<div id="eb-topbar"></div>
<div id="eb-header"></div>

<main class="container">
  <div id="pix" class="pix-wrap">
    <p>Carregando pagamento…</p>
  </div>
</main>

<div id="eb-footer"></div>

<script src="config.js"></script>
<script src="partials.js"></script>
<script src="pix.js"></script>
</body>
</html>
