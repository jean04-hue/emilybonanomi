<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque — Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="admin.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
</head>
<body>
    <div id="wrap"><p style="color:#999">Carregando…</p></div>

    <script>
    renderLayout({
        active: 'estoque',
        title: 'Estoque',
        subtitle: 'Edite o estoque diretamente nas tabelas e clique em Salvar'
    });

    (async () => {
        let produtos = [];
        try { produtos = await api('/admin/products'); } catch { return; }
        const box = document.getElementById('wrap');
        box.innerHTML = '';

        for (const p of produtos) {
            let vs = [];
            try { vs = await api('/products/' + p.id + '/variations'); } catch {}
            const html = `
                <div class="card" style="margin-bottom: 16px;">
                    <h3 style="font-size:15px; margin-bottom:12px;">${p.nome} <span style="color:#999; font-weight:normal; font-size:12px">#${p.id}</span></h3>
                    ${vs.length ? `
                    <table>
                        <thead>
                            <tr>
                                <th>Cor</th>
                                <th>Tamanho</th>
                                <th style="width:150px">Estoque</th>
                                <th style="width:100px">Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${vs.map(v => `
                                <tr data-vid="${v.id}">
                                    <td>${v.cor || '-'}</td>
                                    <td>${v.tamanho || '-'}</td>
                                    <td><input type="number" min="0" value="${v.estoque || 0}" style="width:100px; padding:6px;"></td>
                                    <td><button class="btn btn-sm btn-beige" onclick="salvar(this)">Salvar</button></td>
                                </tr>`).join('')}
                        </tbody>
                    </table>` : '<p style="color:#aaa; font-size:13px">Sem variações cadastradas.</p>'}
                </div>`;
            box.insertAdjacentHTML('beforeend', html);
        }
    })();

    async function salvar(btn) {
        const tr = btn.closest('tr');
        const vid = tr.dataset.vid;
        const est = parseInt(tr.querySelector('input').value, 10) || 0;
        try { 
            await api('/products/variations/' + vid, { method:'PUT', body:{ estoque: est } }); 
            toast('Estoque atualizado'); 
        } catch {}
    }
    window.salvar = salvar;
    </script>
</body>
</html>
