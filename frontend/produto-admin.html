<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="admin.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
    <style>
        /* Estilos da Galeria Avançada */
        .galeria-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .imagem-principal-wrapper {
            width: 300px;
            height: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #f9f9f9;
        }
        .imagem-principal-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .miniaturas-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }
        .miniaturas-wrapper img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .miniaturas-wrapper img:hover, .miniaturas-wrapper img.ativa {
            border-color: #2e7d32; /* ou a cor principal do seu admin */
            transform: scale(1.05);
        }

        /* Estilos das Avaliações */
        .resumo-avaliacoes {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .card-avaliacao {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .card-avaliacao h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .estrelas {
            color: #f4b400;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .data-avaliacao {
            color: #777;
            font-size: 12px;
            display: block;
            margin-bottom: 8px;
        }
        .comentario-texto {
            margin: 0;
            color: #555;
        }
    </style>
</head>
<body>

<script>
    if (!guard()) throw 'x';
    sidebar('produtos');
</script>

<main class="main">

    <div class="topbar">
        <div>
            <h1>Detalhes do Produto</h1>
            <small id="codigoProduto"></small>
        </div>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-outline" onclick="history.back()">
                ← Voltar
            </button>
            <button id="btnVerSite" class="btn">
                Ver produto no site
            </button>
        </div>
    </div>

    <!-- informações principais -->
    <div class="card" id="produto">
        Carregando...
    </div>

    <!-- galeria -->
    <div class="card" style="margin-top:20px">
        <h2>Galeria</h2>
        <div class="galeria-container" style="margin-top: 15px;">
            <div class="imagem-principal-wrapper">
                <img id="imagemPrincipal" src="" alt="Imagem do produto">
            </div>
            <div id="galeria" class="miniaturas-wrapper">
                <!-- Miniaturas entram aqui via JS -->
            </div>
        </div>
    </div>

    <!-- variações -->
    <div class="card" style="margin-top:20px">
        <h2>Variações</h2>
        <table>
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Cor</th>
                    <th>Tamanho</th>
                    <th>Estoque</th>
                </tr>
            </thead>
            <tbody id="variacoes">
                <!-- Variações entram aqui via JS -->
            </tbody>
        </table>
    </div>

    <!-- avaliações -->
    <div id="card-avaliacoes" class="card" style="margin-top:20px">
        <h2>Avaliações</h2>
        <div id="media" class="resumo-avaliacoes"></div>
        <div id="avaliacoes">
            Carregando...
        </div>
    </div>

</main>

<script src="produto-admin.js"></script>
</body>
</html>
