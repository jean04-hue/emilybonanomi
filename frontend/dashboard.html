<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — Admin Emily Bonanomi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="admin.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
</head>
<body>

    <!-- Conteúdo Específico da Tela -->
    <div class="grid" id="cards">
        <div class="metric"><div class="label">Vendas hoje</div><div class="value" id="vendasHoje">–</div><div class="hint" id="hintHoje"></div></div>
        <div class="metric"><div class="label">Vendas do mês</div><div class="value" id="vendasMes">–</div></div>
        <div class="metric"><div class="label">Ticket médio</div><div class="value" id="ticketMedio">–</div></div>
        <div class="metric"><div class="label">Pedidos</div><div class="value" id="totalPedidos">–</div><div class="hint" id="hintAguardando"></div></div>
        <div class="metric"><div class="label">Clientes</div><div class="value" id="totalClientes">–</div></div>
        <div class="metric"><div class="label">Produtos</div><div class="value" id="totalProdutos">–</div><div class="hint" id="hintSemEstoque"></div></div>
    </div>

    <div class="dashboard-bottom">
        <div class="card">
            <h3 style="margin-bottom:12px;font-size:16px">Top 5 produtos mais vendidos</h3>
            <table>
                <thead><tr><th>Produto</th><th>Qtd</th><th>Receita</th></tr></thead>
                <tbody id="topProdutos"><tr><td colspan="3">Carregando…</td></tr></tbody>
            </table>
        </div>
        <div class="card">
            <h3 style="margin-bottom:12px;font-size:16px">Últimos pedidos</h3>
            <table>
                <thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="ultimosPedidos"><tr><td colspan="4">Carregando…</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
    // 1. Injeta o Layout Mestre
    renderLayout({
        active: 'dashboard',
        title: 'Dashboard',
        subtitle: 'Visão geral do seu e-commerce'
    });

    // 2. Busca e renderiza os dados
    (async () => {
        let d = {};
        try { d = await api('/admin/dashboard'); } catch { return; }

        document.getElementById('vendasHoje').textContent   = money(d.vendasHoje || 0);
        document.getElementById('hintHoje').textContent     = (d.pedidosHoje != null ? d.pedidosHoje  + ' pedidos' : '');
        document.getElementById('vendasMes').textContent    = money(d.vendasMes || d.faturamento || 0);
        document.getElementById('ticketMedio').textContent  = money(d.ticketMedio || 0);
        document.getElementById('totalPedidos').textContent = d.totalPedidos ?? '-';
        document.getElementById('hintAguardando').textContent = (d.pedidosAguardando != null ? d.pedidosAguardando + ' aguardando pagto' : '');
        document.getElementById('totalClientes').textContent  = d.totalClientes  ?? '-';
        document.getElementById('totalProdutos').textContent  = d.totalProdutos  ?? '-';
        document.getElementById('hintSemEstoque').textContent = (d.produtosSemEstoque != null ? d.produtosSemEstoque + ' sem estoque' : '');

        const tbTop = document.getElementById('topProdutos');
        if (Array.isArray(d.topProdutos) && d.topProdutos.length) {
            tbTop.innerHTML = d.topProdutos.slice(0,5).map(p =>
                `<tr><td>${p.nome || p.produto}</td><td>${p.quantidade || p.qtd || 0}</td><td>${money(p.receita || 0)}</td></tr>`
            ).join('');
        } else {
            tbTop.innerHTML = '<tr><td colspan="3" style="color:#999">Sem dados suficientes</td></tr>';
        }

        const tbP = document.getElementById('ultimosPedidos');
        const ups = d.ultimosPedidos || [];
        if (ups.length) {
            tbP.innerHTML = ups.slice(0,8).map(p =>
                `<tr>
                    <td>${p.codigo_pedido || p.id}</td>
                    <td>${p.cliente || '-'}</td>
                    <td>${money(p.total)}</td>
                    <td>${statusBadge(p.status)}</td>
                </tr>`
            ).join('');
        } else {
            tbP.innerHTML = '<tr><td colspan="4" style="color:#999">Nenhum pedido</td></tr>';
        }
    })();
    </script>
</body>
</html>
