<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><title>Avaliações — Admin</title>
<link rel="stylesheet" href="admin.css">
<script src="config.js"></script><script src="admin.js"></script>
</head>
<body>
<script>if(!guard()){throw 'x'} sidebar('avaliacoes');</script>

<main class="main">
    <div class="topbar"><h1>Avaliações</h1></div>
    <div class="card" style="padding:0">
        <table><thead><tr>
            <th>Produto</th><th>Cliente</th><th>Nota</th><th>Comentário</th><th>Data</th><th style="width:100px"></th>
        </tr></thead>
        <tbody id="tabela"><tr><td colspan="6">Carregando…</td></tr></tbody></table>
    </div>
</main>

<script>
function stars(n) { const x = Math.round(Number(n)||0); return '★'.repeat(x) + '<span style="color:#ddd">'+'★'.repeat(5-x)+'</span>'; }

(async () => {
    let av = [];
    try { av = await api('/admin/reviews'); } catch { return; }
    const tb = document.getElementById('tabela');
    if (!av.length) { tb.innerHTML = '<tr><td colspan="6">Sem avaliações</td></tr>'; return; }
    
    tb.innerHTML = av.map(a => `
        <tr>
            <td 
                style="cursor: pointer; color: #2e7d32; font-weight: bold; text-decoration: underline;" 
                onclick="window.location.href='produto-admin.html?id=${a.produto_id}#card-avaliacoes'"
                title="Ver detalhes do produto"
            >
                ${a.produto || a.produto_nome || '#' + a.produto_id} 🔗
            </td>
            <td>${a.cliente || a.usuario_nome || '#' + a.usuario_id}</td>
            <td style="color:#d9a57c;font-size:16px">${stars(a.nota)}</td>
            <td>${(a.comentario || '').replace(/</g,'&lt;')}</td>
            <td>${dateBR(a.created_at || a.criado_em)}</td>
            <td><button class="btn btn-sm btn-danger" onclick="remover(${a.id})">Remover</button></td>
        </tr>`).join('');
})();

async function remover(id) {
    if (!confirm('Remover avaliação?')) return;
    try { await api('/admin/reviews/' + id, { method:'DELETE' }); toast('Removida'); setTimeout(()=>location.reload(),400); } catch {}
}
window.remover = remover;
</script>
</body></html>
