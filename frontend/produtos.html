<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos — Admin Emily Bonanomi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="admin.css">
    <script src="config.js"></script>
    <script src="admin.js"></script>
</head>
<body>

    <!-- Conteúdo Específico da Página -->
    <div class="card" style="padding:0">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Status</th>
                    <th style="width:280px">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
                <tr><td colspan="7">Carregando…</td></tr>
            </tbody>
        </table>
    </div>

    <script>
    // 1. Injeta o Layout Mestre
    renderLayout({
        active: 'produtos',
        title: 'Produtos',
        subtitle: 'Gerenciamento de catálogo e estoque',
        actions: '<a href="produto-form.html" class="btn btn-beige">+ Novo produto</a>'
    });

    // 2. Lógica Específica da Tela
    (async () => {
        let produtos = [];
        try { produtos = await api('/admin/products'); } catch { return; }
        const tb = document.getElementById('tabela');
        if (!produtos.length) { 
            tb.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#999">Nenhum produto cadastrado</td></tr>'; 
            return; 
        }

        // Estoque total por produto (soma variações)
        const totais = {};
        await Promise.all(produtos.map(async p => {
            try {
                const vs = await api('/products/' + p.id + '/variations');
                totais[p.id] = (vs || []).reduce((s,v) => s + Number(v.estoque||0), 0);
            } catch { totais[p.id] = 0; }
        }));

        tb.innerHTML = produtos.map(p => `
            <tr class="linha-produto" style="cursor:pointer" onclick="location.href='produto-admin.html?id=${p.id}'">
                <td>${p.id}</td>
                <td><strong>${p.nome}</strong></td>
                <td>${p.categoria_nome || '<span style="color:#aaa">—</span>'}</td>
                <td>${money(p.preco)}</td>
                <td>${totais[p.id]} un</td>
                <td>${p.ativo ? '<span class="badge badge-green">Ativo</span>' : '<span class="badge badge-gray">Inativo</span>'}</td>
                <td class="actions">
                    <a href="editar-produto.html?id=${p.id}" class="btn btn-sm btn-outline" onclick="event.stopPropagation()">Editar</a>
                    <a href="produto-imagens.html?id=${p.id}" class="btn btn-sm btn-beige" onclick="event.stopPropagation()">Imagens</a>
                    <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); desativar(${p.id})">Desativar</button>
                </td>
            </tr>`).join('');
    })();

    async function desativar(id) {
        if (!confirm('Desativar este produto?')) return;
        try { 
            await api('/admin/products/' + id, { method: 'DELETE' }); 
            toast('Produto desativado'); 
            setTimeout(() => location.reload(), 500); 
        } catch {}
    }
    window.desativar = desativar;
    </script>
</body>
</html>
